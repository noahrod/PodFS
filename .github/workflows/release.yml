name: Create release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git tag to create for the release
        required: true
        type: string
      release_name:
        description: Release title
        required: false
        default: PodFS release
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_NAME: ${{ inputs.release_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable APK
        run: ./gradlew :app:assembleDebug

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PodFS.apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/PodFS.apk \
            --title "$RELEASE_NAME" \
            --generate-notes